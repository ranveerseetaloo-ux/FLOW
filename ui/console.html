<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VectraOne-Flow — Console</title>
<style>
  :root{--navy:#1f3864;--blue:#2e5496;--accent:#3b7dd8;--bg:#eef1f6;--panel:#fff;
    --line:#d7deea;--ink:#25303f;--muted:#6b7690;--head:#2b3a56;--ok:#2f8a57;--bad:#c0392b;--sidebar:#f4f6fb;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px}
  a{color:var(--blue);text-decoration:none}
  .topbar{background:var(--head);color:#fff;display:flex;align-items:center;gap:18px;padding:0 16px;height:44px}
  .topbar .brand{font-weight:700;letter-spacing:.3px}.topbar .brand b{color:#8fb4ef}
  .topbar .tabs{display:flex;height:100%}
  .topbar .tabs a{color:#cdd8ee;padding:0 14px;display:flex;align-items:center;font-size:13px}
  .topbar .tabs a.active,.topbar .tabs a:hover{background:#20293e;color:#fff}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:#aebbd6}
  .chip{background:#33507e;color:#dfe8f6;padding:2px 8px;border-radius:4px;font-size:11px}
  .chip.ok{background:#245c40;color:#c7f0d8}.chip.bad{background:#6e2b28;color:#f3c9c5}
  .shell{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 44px)}
  aside{background:var(--sidebar);border-right:1px solid var(--line);padding:14px 0}
  aside .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:12px 16px 4px}
  aside a{display:block;padding:6px 16px 6px 22px;color:var(--ink);font-size:13px;border-left:3px solid transparent;cursor:pointer}
  aside a:hover{background:#e7edf7}
  aside a.active{background:#e2eafa;border-left-color:var(--accent);color:var(--navy);font-weight:600}
  main{padding:18px 22px}
  h1.page{font-size:18px;margin:0 0 2px;color:var(--navy)}
  .sub{color:var(--muted);margin:0 0 16px;font-size:12.5px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
  .panel .hd{background:#f6f8fc;border-bottom:1px solid var(--line);padding:9px 14px;font-weight:650;font-size:12.5px;color:var(--head);border-radius:6px 6px 0 0;display:flex;align-items:center;gap:10px}
  .panel .bd{padding:14px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th{background:#fafbfe;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  tr:hover td{background:#f7faff}
  .form{display:grid;grid-template-columns:180px 1fr 170px 1fr;gap:12px 14px;align-items:center}
  .form label{color:var(--muted);font-size:12.5px}.form .full{grid-column:2/5}
  input,select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-size:13px;background:#fff;width:100%}
  input[type=checkbox]{width:auto}
  textarea{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;min-height:80px}
  .btn{background:var(--blue);color:#fff;border:0;padding:8px 16px;border-radius:5px;font-size:13px;cursor:pointer}
  .btn:hover{background:var(--accent)}.btn.ghost{background:#e7edf7;color:var(--blue)}.btn.sm{padding:4px 10px;font-size:12px}
  .bar{display:flex;gap:10px;margin-top:14px}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#eaf0fa;color:var(--blue);font-weight:600}
  .pill.ded{background:#e5f2ea;color:var(--ok)}.pill.app{background:#fbeede;color:#b9791b}.pill.time{background:#efe9fb;color:#6b4fb0}
  .msg{font-size:12.5px;margin-top:10px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
  .hidden{display:none!important}
  .loginwrap{max-width:320px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px}
  .loginwrap h2{margin:0 0 14px;font-size:16px;color:var(--navy)}.loginwrap input{margin-bottom:10px}
  .muted{color:var(--muted)}
  pre{background:#0f1830;color:#cfe0ff;padding:12px;border-radius:6px;font-size:11.5px;overflow:auto;max-height:280px}
  .bararow{height:14px;background:var(--accent);border-radius:3px}
  .kv td.k{color:var(--muted);width:230px}.kv td.v{font-weight:600}
  .exp-soon{color:#b9791b}.exp-bad{color:var(--bad);font-weight:700}
  .tiergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .tier{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}.tier b{color:var(--navy)}
  .ifrow{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fbfcfe}
  .ifrow .h{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .ifrow .name{font-weight:700;color:var(--navy);font-family:ui-monospace,monospace}
  .state{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}.up{background:#e3f3ea;color:var(--ok)}.down{background:#eee;color:var(--muted)}
  .ifgrid{display:grid;grid-template-columns:110px 1fr 110px 1fr;gap:7px 12px;align-items:center;font-size:12.5px}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">Vectra<b>One</b>-Flow</span>
  <div class="tabs"><a class="active">Configuration</a><a href="config-reference.html">Docs</a></div>
  <div class="right">
    <span>Health <span class="chip ok">OK</span></span>
    <span id="lic" class="chip">license…</span>
    <span id="who">not signed in</span>
  </div>
</div>

<div id="login" class="loginwrap">
  <h2>Sign in</h2>
  <input id="u" placeholder="username" value="admin"/>
  <input id="p" type="password" placeholder="password"/>
  <button class="btn" onclick="login()">Sign in</button>
  <p class="msg bad" id="lerr"></p>
</div>

<div id="app" class="shell hidden">
  <aside>
    <div class="grp">Traffic Policies</div>
    <a data-page="policies" class="active">Policies</a>
    <a data-page="reporting">Monitor / Reports</a>
    <div class="grp">Objects</div>
    <a data-page="ipgroups">Networks / IP Groups</a>
    <a data-page="customers">Customers</a>
    <div class="grp">System</div>
    <a data-page="interfaces">Interfaces / Network</a>
    <a data-page="license">Licensing</a>
    <a href="config-reference.html">Configuration Reference</a>
  </aside>
  <main id="view"></main>
</div>

<script>
const API_BASE = "http://197.242.184.113:8000";     // your server; "" if served by backend
const API = (API_BASE || location.origin) + "/api";
let TOKEN=null, PIPES=[], GROUPS=[], CUSTOMERS=[], IFDATA=null;
const h  = ()=>({ "Authorization":"Bearer "+TOKEN });
const hj = ()=>({ "Authorization":"Bearer "+TOKEN, "Content-Type":"application/json" });

async function login(){
  const body=new URLSearchParams({username:u.value,password:p.value});
  const r=await fetch(API+"/auth/token",{method:"POST",body});
  if(!r.ok){ lerr.textContent="Login failed"; return; }
  TOKEN=(await r.json()).access_token;
  login_.classList.add("hidden"); document.getElementById("app").classList.remove("hidden");
  document.getElementById("who").textContent="admin ▾";
  licenseChip(); route("policies");
}
const login_=document.getElementById("login");

async function licenseChip(){
  try{ const d=await (await fetch(API+"/license")).json();
    const c=document.getElementById("lic");
    c.textContent=d.licensed?(d.tier+" · licensed"):"UNLICENSED";
    c.className="chip "+(d.licensed?"ok":"bad");
  }catch(e){}
}

document.querySelectorAll("aside a[data-page]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();route(a.dataset.page);}));
function route(page){
  document.querySelectorAll("aside a[data-page]").forEach(a=>a.classList.toggle("active",a.dataset.page===page));
  ({policies:pagePolicies,reporting:pageReports,ipgroups:pageIPGroups,customers:pageCustomers,
    interfaces:pageInterfaces,license:pageLicense}[page]||pagePolicies)();
}
async function refresh(){
  [PIPES,GROUPS,CUSTOMERS]=await Promise.all([
    fetch(API+"/pipes",{headers:h()}).then(r=>r.json()),
    fetch(API+"/ip-groups",{headers:h()}).then(r=>r.json()),
    fetch(API+"/customers",{headers:h()}).then(r=>r.json())]);
}
const V=()=>document.getElementById("view");

// ============ POLICIES ============
async function pagePolicies(){
  await refresh();
  const cls={dedicated:"ded",contended:"",application:"app",time_based:"time",protocol:""};
  const rows=PIPES.map(p=>`<tr>
      <td>${p.name}</td><td><span class="pill ${cls[p.ptype]||''}">${p.ptype}</span></td>
      <td>${p.download_mbps||'-'}</td><td>${p.upload_mbps||'-'}</td>
      <td>${p.contention_ratio>1?('1:'+p.contention_ratio):'—'}</td><td>prio ${p.priority}</td>
      <td><button class="btn sm ghost" onclick="editPolicy(${p.id})">View</button></td></tr>`).join("");
  V().innerHTML=`
    <h1 class="page">Policy</h1><p class="sub">Policies define the traffic to match and the bandwidth action to take on it.</p>
    <div class="panel"><div class="hd">Policies <span class="pill">${PIPES.length}</span>
      <button class="btn sm" style="margin-left:auto" onclick="editPolicy(0)">+ New Policy</button></div>
      <div class="bd" style="padding:0"><table><thead><tr><th>Policy Name</th><th>Type</th><th>Down</th><th>Up</th><th>Contention</th><th>Priority</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan=7 class="muted" style="padding:14px">No policies yet.</td></tr>'}</tbody></table></div></div>
    <div id="editor"></div>
    <div class="panel"><div class="hd">Compile Shaping Policy → tc</div><div class="bd">
      <div class="form">
        <label>Interface</label><input id="ci_if" value="eth0"/>
        <label>Direction</label><select id="ci_dir"><option>download</option><option>upload</option></select>
        <label>Link Mbps</label><input id="ci_total" type="number" value="1000"/>
        <label></label><span><button class="btn" onclick="compile()">Compile</button></span>
      </div>
      <div id="ci_warn"></div><pre id="ci_out" style="margin-top:12px;display:none"></pre>
    </div></div>`;
}
function editPolicy(id){
  const p=PIPES.find(x=>x.id===id)||{name:"",ptype:"dedicated",download_mbps:100,upload_mbps:20,contention_ratio:4,priority:3,match_label:""};
  const grpOpts=['<option value="">— none —</option>'].concat(GROUPS.map(g=>`<option value="${g.id}">${g.cidr} (${g.label||''})</option>`)).join("");
  const to=t=>`<option value="${t}" ${p.ptype===t?'selected':''}>${t}</option>`;
  document.getElementById("editor").innerHTML=`
    <div class="panel"><div class="hd">Edit Policy ${id?('#'+id):'(new)'}</div><div class="bd">
      <div class="form">
        <label>Policy Name</label><input id="f_name" value="${p.name}" class="full"/>
        <label>Type / Action</label><select id="f_type" onchange="typeChanged()">${to('dedicated')}${to('contended')}${to('time_based')}${to('protocol')}${to('application')}</select>
        <label>Priority</label><select id="f_prio">${[0,1,2,3,4,5,6,7].map(n=>`<option ${p.priority===n?'selected':''}>${n}</option>`).join("")}</select>
        <label>Guaranteed / Rate Down (Mbps)</label><input id="f_down" type="number" value="${p.download_mbps||0}"/>
        <label>Rate Up (Mbps)</label><input id="f_up" type="number" value="${p.upload_mbps||0}"/>
        <label id="l_ratio">Contention ratio (1:N)</label><select id="f_ratio">${[1,2,4,8,10,20].map(n=>`<option ${p.contention_ratio===n?'selected':''}>${n}</option>`).join("")}</select>
        <label id="l_match">Application / Protocol</label><input id="f_match" value="${p.match_label||''}" placeholder="e.g. bittorrent"/>
      </div>
      <div class="panel" style="margin-top:16px"><div class="hd">Filter Rules</div><div class="bd" style="padding:0">
        <table><thead><tr><th>Direction</th><th>Network / IP Group (Host)</th><th>Application</th><th>DSCP</th></tr></thead>
        <tbody><tr>
          <td><select id="r_dir"><option>download</option><option>upload</option><option>both</option></select></td>
          <td><select id="r_group">${grpOpts}</select></td>
          <td><input id="r_app" value="${p.match_label||''}" placeholder="ALL"/></td>
          <td><select><option>ALL</option><option>EF</option><option>AF41</option><option>CS1</option></select></td>
        </tr></tbody></table></div></div>
      <div class="bar"><button class="btn" onclick="savePolicy(${id})">Apply Changes</button>
        <button class="btn ghost" onclick="document.getElementById('editor').innerHTML=''">Cancel</button></div>
      <div id="pmsg" class="msg"></div>
    </div></div>`;
  typeChanged();
}
function typeChanged(){
  const t=document.getElementById("f_type").value;
  const showRatio=t==="contended", showMatch=(t==="protocol"||t==="application");
  document.getElementById("l_ratio").style.visibility=showRatio?"visible":"hidden";
  document.getElementById("f_ratio").style.visibility=showRatio?"visible":"hidden";
  document.getElementById("l_match").style.visibility=showMatch?"visible":"hidden";
  document.getElementById("f_match").style.visibility=showMatch?"visible":"hidden";
}
async function savePolicy(id){
  const msg=document.getElementById("pmsg");msg.textContent="";
  const t=document.getElementById("f_type").value, marky=(t==="protocol"||t==="application");
  const body={name:document.getElementById("f_name").value.trim(),ptype:t,
    download_mbps:parseFloat(document.getElementById("f_down").value)||0,
    upload_mbps:parseFloat(document.getElementById("f_up").value)||0,
    contention_ratio:parseInt(document.getElementById("f_ratio").value)||1,
    priority:parseInt(document.getElementById("f_prio").value)||3,
    match_label:marky?(document.getElementById("f_match").value.trim()||null):null,
    fwmark:marky?16:null};
  if(!body.name){msg.className="msg bad";msg.textContent="Policy name is required.";return;}
  const r=await fetch(API+"/pipes",{method:"POST",headers:hj(),body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){msg.className="msg bad";msg.textContent="Error: "+(d.detail||"could not save");return;}
  const gid=document.getElementById("r_group").value;
  if(gid){ await fetch(`${API}/ip-groups/${gid}/assign/${d.id}`,{method:"PATCH",headers:h()}); }
  pagePolicies();
}
async function compile(){
  const req={interface:ci_if.value,direction:ci_dir.value,total_mbps:parseFloat(ci_total.value)};
  const d=await (await fetch(API+"/policies/compile",{method:"POST",headers:hj(),body:JSON.stringify(req)})).json();
  const out=document.getElementById("ci_out");out.style.display="block";out.textContent=(d.commands||[]).join("\n");
  document.getElementById("ci_warn").innerHTML=(d.warnings||[]).map(w=>`<div class="msg bad">⚠ ${w}</div>`).join("");
}

// ============ MONITOR / REPORTS ============
async function pageReports(){
  V().innerHTML=`<h1 class="page">Monitor — Traffic Reports</h1><p class="sub">Live usage from the flow store.</p>
    <div class="panel"><div class="hd">Top Talkers
      <select id="rdim" style="width:auto;margin-left:auto" onchange="loadRep()">
        <option value="application">Application</option><option value="protocol">Protocol</option>
        <option value="pipe">Pipe</option><option value="ip">IP</option><option value="customer">Customer</option></select>
      <button class="btn sm ghost" onclick="dlRep()">Download CSV</button></div>
      <div class="bd" style="padding:0"><table id="reptbl"></table></div>
      <div class="bd"><span class="muted" id="repsrc"></span></div></div>`;
  loadRep();
}
async function loadRep(){
  const dim=document.getElementById("rdim").value;
  const d=await (await fetch(API+`/reports/top?dimension=${dim}`,{headers:h()})).json();
  document.getElementById("repsrc").textContent="source: "+d.source;
  const max=Math.max(...d.rows.map(r=>r.bytes),1);
  document.getElementById("reptbl").innerHTML=
    `<thead><tr><th>${dim}</th><th>Volume</th><th style="width:45%">Share</th><th>Flows</th></tr></thead><tbody>`+
    d.rows.map(r=>`<tr><td>${r.key}</td><td>${(r.bytes/1e9).toFixed(2)} GB</td>
      <td><div class="bararow" style="width:${Math.round(100*r.bytes/max)}%"></div></td>
      <td>${r.flows.toLocaleString()}</td></tr>`).join("")+`</tbody>`;
}
function dlRep(){
  const dim=document.getElementById("rdim").value;
  fetch(API+`/reports/download?dimension=${dim}`,{headers:h()}).then(r=>r.blob()).then(b=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`report_${dim}.csv`;a.click();});
}

// ============ IP GROUPS ============
async function pageIPGroups(){
  await refresh();
  const pn=id=>{const p=PIPES.find(x=>x.id===id);return p?p.name:'<span class="muted">unassigned</span>';};
  const rows=GROUPS.map(g=>`<tr><td>${g.cidr}</td><td>${g.label||''}</td><td>${g.customer_id}</td><td>${pn(g.pipe_id)}</td></tr>`).join("");
  const co=CUSTOMERS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
  V().innerHTML=`<h1 class="page">Networks / IP Groups</h1><p class="sub">Public IPs and CIDR groups that carry subscriber traffic.</p>
    <div class="panel"><div class="hd">Add IP Group</div><div class="bd">
      <div class="form"><label>Customer</label><select id="g_cust">${co}</select>
        <label>CIDR</label><input id="g_cidr" placeholder="203.0.113.7/32"/>
        <label>Label</label><input id="g_label" placeholder="home7"/>
        <label>Plan Down / Up</label><span style="display:flex;gap:6px"><input id="g_down" type="number" placeholder="down"/><input id="g_up" type="number" placeholder="up"/></span></div>
      <div class="bar"><button class="btn" onclick="addGroup()">Add</button></div><div id="gmsg" class="msg"></div></div></div>
    <div class="panel"><div class="hd">IP Groups <span class="pill">${GROUPS.length}</span></div><div class="bd" style="padding:0">
      <table><thead><tr><th>CIDR</th><th>Label</th><th>Customer</th><th>Policy</th></tr></thead><tbody>${rows||''}</tbody></table></div></div>`;
}
async function addGroup(){
  const msg=document.getElementById("gmsg");msg.textContent="";
  const body={customer_id:parseInt(g_cust.value),cidr:g_cidr.value.trim(),label:g_label.value.trim(),
    download_mbps:parseFloat(g_down.value)||0,upload_mbps:parseFloat(g_up.value)||0};
  const r=await fetch(API+"/ip-groups",{method:"POST",headers:hj(),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){msg.className="msg bad";msg.textContent="Error: "+(d.detail||"failed");return;}
  pageIPGroups();
}

// ============ CUSTOMERS ============
async function pageCustomers(){
  await refresh();
  const rows=CUSTOMERS.map(c=>`<tr><td>${c.ref}</td><td>${c.name}</td><td>${c.contact_email||''}</td><td>${c.active?'active':'—'}</td></tr>`).join("");
  V().innerHTML=`<h1 class="page">Customers</h1><p class="sub">Billing entities that own IP groups.</p>
    <div class="panel"><div class="hd">Add Customer</div><div class="bd">
      <div class="form"><label>Reference</label><input id="c_ref" placeholder="acme"/>
        <label>Name</label><input id="c_name" placeholder="Acme Ltd"/>
        <label>Email</label><input id="c_email" placeholder="noc@acme.example" class="full"/></div>
      <div class="bar"><button class="btn" onclick="addCustomer()">Add</button></div><div id="cmsg" class="msg"></div></div></div>
    <div class="panel"><div class="hd">Customers <span class="pill">${CUSTOMERS.length}</span></div><div class="bd" style="padding:0">
      <table><thead><tr><th>Ref</th><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody>${rows||''}</tbody></table></div></div>`;
}
async function addCustomer(){
  const msg=document.getElementById("cmsg");msg.textContent="";
  const body={ref:c_ref.value.trim(),name:c_name.value.trim(),contact_email:c_email.value.trim()};
  const r=await fetch(API+"/customers",{method:"POST",headers:hj(),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){msg.className="msg bad";msg.textContent="Error: "+(d.detail||"failed");return;}
  pageCustomers();
}

// ============ INTERFACES ============
async function pageInterfaces(){
  IFDATA=await (await fetch(API+"/interfaces",{headers:h()})).json();
  const cfg=(IFDATA.config&&IFDATA.config.interfaces)||[]; const byName=Object.fromEntries(cfg.map(c=>[c.name,c]));
  const det=IFDATA.detected.length?IFDATA.detected:[{name:"eth0",mac:"—",state:"unknown",speed_mbps:null,addresses:[],is_bridge:false}];
  const sl=m=>!m||m<0?"—":(m>=1000?(m/1000)+"G":m+"M");
  const rows=det.map(i=>{const c=byName[i.name]||{};
    const ro=IFDATA.roles.map(r=>`<option ${c.role===r?'selected':''}>${r}</option>`).join("");
    const sp=['<option value="">auto</option>'].concat(IFDATA.port_speeds.map(s=>`<option ${c.speed===s?'selected':''}>${s}</option>`)).join("");
    const addrs=((c.addresses&&c.addresses.length?c.addresses:["",""]).concat([""])).slice(0,3);
    return `<div class="ifrow" data-name="${i.name}">
      <div class="h"><span class="name">${i.name}</span><span class="state ${i.state==='up'?'up':'down'}">${i.state}</span>
        <span class="muted">MAC ${i.mac} · link ${sl(i.speed_mbps)} · ${i.addresses.join(", ")||"no address"}</span></div>
      <div class="ifgrid">
        <label class="muted">Role</label><select class="f-role">${ro}</select>
        <label class="muted">Port speed</label><select class="f-speed">${sp}</select>
        <label class="muted">DHCP v4</label><span><input type="checkbox" class="f-dhcp" ${c.dhcp4?'checked':''}/> auto</span>
        <label class="muted">Comment</label><input type="text" class="f-comment" value="${c.comment||''}" placeholder="e.g. WAN"/>
        <label class="muted">Static addresses</label><div style="grid-column:2/5">${addrs.map(a=>`<input type="text" class="f-addr" style="margin-bottom:5px" value="${a}" placeholder="192.168.0.161/24"/>`).join("")}</div>
      </div></div>`;}).join("");
  V().innerHTML=`<h1 class="page">Interfaces / Network</h1><p class="sub">Assign roles, addressing, gateway and port speed. Bridge NICs are enslaved to the L2 bridge.</p>
    <div class="panel"><div class="hd">Interface Settings</div><div class="bd">${rows}</div></div>
    <div class="panel"><div class="hd">Gateway Settings</div><div class="bd">
      <div class="form"><label>IPv4 gateway</label><input id="gw4" placeholder="192.168.0.1"/>
        <label>Bridge name</label><input id="brname" value="br0"/></div>
      <div class="bar"><button class="btn" onclick="applyIf()">Preview / Apply Changes</button></div>
      <div id="ifmsg" class="msg"></div><pre id="ifcmds" style="margin-top:12px;display:none"></pre></div></div>`;
}
async function applyIf(){
  const ifs=[...document.querySelectorAll(".ifrow")].map(el=>({
    name:el.dataset.name, role:el.querySelector(".f-role").value, speed:el.querySelector(".f-speed").value||null,
    dhcp4:el.querySelector(".f-dhcp").checked, comment:el.querySelector(".f-comment").value,
    addresses:[...el.querySelectorAll(".f-addr")].map(i=>i.value.trim()).filter(Boolean)}));
  const body={interfaces:ifs,gateway4:document.getElementById("gw4").value.trim(),gateway6:"",bridge_name:document.getElementById("brname").value.trim()||"br0",apply:false};
  const msg=document.getElementById("ifmsg");msg.textContent="";
  const r=await fetch(API+"/interfaces/apply",{method:"POST",headers:hj(),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){msg.className="msg bad";msg.textContent="Error: "+(d.detail||"failed");return;}
  msg.className="msg ok";msg.textContent="Saved ✔  Commands that will run on the node:";
  const pre=document.getElementById("ifcmds");pre.style.display="block";pre.textContent=(d.commands||[]).join("\n");
}

// ============ LICENSING ============
async function pageLicense(){
  const d=await (await fetch(API+"/license")).json();
  const ec=d.days_left<0?"exp-bad":(d.days_left<30?"exp-soon":"");
  const kv=[["Licensed",d.licensed?"✔ Yes":"✘ No"],["Licensee",d.licensee||"—"],["Host ID",d.host_id||"—"],
    ["Model",d.model||"—"],["Package / Tier",d.tier?(d.tier+" tier"):"—"],
    ["Max Bandwidth",d.max_mbps?d.max_mbps.toLocaleString()+" Mbps":"—"],
    ["Deep Packet Inspection",d.dpi?"✔ Included":"Not included"],["Support",d.support||"—"],
    ["Issued",d.issued||"—"],["Expiry",`<span class="${ec}">${d.expires||"—"}${d.days_left>=0?` (${d.days_left} days left)`:" (EXPIRED)"}</span>`],
    ["Serial",d.serial||"—"]];
  const tiers=Object.entries(d.tiers||{}).map(([k,v])=>`<div class="tier"><b>${k} tier</b><br><span class="muted">${v.toLocaleString()} Mbps · annual + Standard support</span></div>`).join("");
  V().innerHTML=`<h1 class="page">Licensing & Subscription</h1><p class="sub">Annual, per-node license bound to this server's Host ID.</p>
    <div class="panel"><div class="hd">License Status</div><div class="bd" style="padding:0">
      <table class="kv"><tbody>${kv.map(([k,v])=>`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="panel"><div class="hd">Available Packages (annual)</div><div class="bd"><div class="tiergrid">${tiers}</div>
      <p class="muted" style="font-size:12px;margin-top:10px">Each tier includes Standard 24/7/365 6-hour support and all updates. DPI is a separate add-on.</p></div></div>
    <div class="panel"><div class="hd">Install / Renew License</div><div class="bd">
      <p class="muted" style="font-size:12.5px">Give your vendor this node's Host ID: <b>${d.host_id||"—"}</b>. Paste the license they issue below.</p>
      <textarea id="licin" placeholder="Paste license key (xxxx.yyyy)"></textarea>
      <div class="bar"><button class="btn" onclick="uploadLic()">Upload License</button></div><div id="licmsg" class="msg"></div></div></div>`;
}
async function uploadLic(){
  const msg=document.getElementById("licmsg");msg.textContent="";
  const r=await fetch(API+"/license/upload",{method:"POST",headers:hj(),body:JSON.stringify({license:document.getElementById("licin").value})});
  const d=await r.json(); if(!r.ok){msg.className="msg bad";msg.textContent="Rejected: "+(d.detail||"invalid");return;}
  msg.className="msg ok";msg.textContent="License installed ✔"; licenseChip(); pageLicense();
}
</script>
